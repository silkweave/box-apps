name: verify
# PARKED until silkweave/box is public. This repo is public and its submodule points at a PRIVATE
# repo, so `actions/checkout` with submodules fails before any step of the pair runs:
#   fatal: repository 'https://github.com/silkweave/box.git/' not found
# Nothing here is wrong; it cannot clone what it is not allowed to see. When box is published,
# restore the two triggers below and delete this block. Until then it can be run by hand from the
# Actions tab, where it will fail for that one reason.
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  # pull_request:
jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      # The submodule guard needs box's default branch to test ancestry against.
      - name: Fetch box's default branch
        run: git -C box fetch --depth=100 origin master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard before anything else
        run: node scripts/guard.ts
      - run: pnpm build
      - run: pnpm verify
      # Every version the index advertises must be fetchable, or `box adopt` fails for a user at
      # the clone. This is the check that only exists once the registry is published.
      - name: Tags match the index
        run: node scripts/registry.ts --check
